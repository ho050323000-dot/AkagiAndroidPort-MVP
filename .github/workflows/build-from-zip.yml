name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract
        run: unzip -q AkagiAndroidPort-MVP.zip

      - name: Build APK
        run: cd AkagiAndroidPort && gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AkagiAndroid-APK
          path: AkagiAndroidPort/app/build/outputs/apk/debug/app-debug.apk
