name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Extract and patch project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q AkagiAndroidPort-MVP.zip -d extracted

          sed -i 's/compileSdk = 37/compileSdk = 36/' extracted/AkagiAndroidPort/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' extracted/AkagiAndroidPort/app/build.gradle.kts
          sed -i 's/androidx.webkit:webkit:1.18.0/androidx.webkit:webkit:1.16.0/' extracted/AkagiAndroidPort/app/build.gradle.kts

      - name: Build APK
        run: |
          gradle -p extracted/AkagiAndroidPort :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AkagiAndroid-APK
          path: extracted/AkagiAndroidPort/app/build/outputs/apk/debug/app-debug.apk
